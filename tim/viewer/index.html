<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long-session trace viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#fafaf9;--panel:#fff;--ink:#1c1b19;--muted:#6b6a65;--line:#e4e2dc;--soft:#f2f1ed;
  --pass:#2f8f5b;--fail:#c8412f;--lucky:#b8860b;--warn:#b8860b;--accent:#3b6fd4;
  --c0:#3b6fd4;--c1:#1c9a8a;--c2:#d9722b;--c3:#8b5cc7;--c4:#7a7a72;--c5:#c2457a;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#161614;--panel:#1f1f1c;--ink:#ecebe6;--muted:#9a988f;--line:#34332e;--soft:#2a2a26;
  --pass:#4cb582;--fail:#ef6b58;--lucky:#d9a93a;--warn:#d9a93a;--accent:#6c97ee;
  --c0:#6c97ee;--c1:#3fc2b0;--c2:#f0955a;--c3:#b08df0;--c4:#a3a39a;--c5:#e476a8;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
nav{display:flex;gap:4px}
nav button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:2px 8px;font-size:12px}
.spacer{flex:1}
input[type=text]{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 8px}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.panel h2{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-weight:600;color:var(--muted);font-size:12px;cursor:default}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--soft);font-size:12px;margin:0 4px 2px 0;border:1px solid var(--line)}
.chip.pass{color:var(--pass)}.chip.fail{color:var(--fail)}.chip.ev{background:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-size:11px}
svg .grid line{stroke:var(--line)}
.sticky{position:sticky;top:56px;max-height:calc(100vh - 70px);overflow:auto}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:8px;border-radius:6px;font-size:12px;margin:4px 0;max-height:260px;overflow:auto}
.sec{margin:10px 0 4px;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bar{height:14px;display:flex;border-radius:3px;overflow:hidden;background:var(--soft)}
.bar span{display:block;height:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hl{background:rgba(217,168,58,.28)}
label{font-size:13px}
select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 6px}
.legend span{margin-right:14px;font-size:12px}
.err{color:var(--fail)}
.bub{padding:7px 10px;border-radius:10px;margin:4px 0;white-space:pre-wrap;word-break:break-word;font-size:13px;max-width:92%}
.bub.user{background:var(--soft);border:1px solid var(--line)}
.bub.agent{background:color-mix(in srgb,var(--accent) 10%,var(--panel));margin-left:6%;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.bub details summary{cursor:pointer;color:var(--muted);font-size:12px}
details.tool{margin:4px 0 4px 6%;font-size:12px}details.tool summary{cursor:pointer;color:var(--accent)}
.turnhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.turnblock{border-left:2px solid var(--line);padding-left:10px;margin:4px 0 8px}
.ev{font-size:12px;margin:8px 0 2px;padding:4px 8px;border-radius:6px;background:var(--soft);border-left:3px solid var(--c3)}
.ev.evc{border-left-color:var(--fail)}.ev.evnew{border-left-color:var(--c2)}details.ev summary{cursor:pointer}
.story{background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5}.story ol{margin:4px 0 0;padding-left:20px}.story li{margin:3px 0}
.okc{color:var(--pass)}.failc{color:var(--fail)}.small{font-size:12px}
mark{background:rgba(217,168,58,.45);color:inherit;border-radius:2px}
tr.sel{background:var(--soft)}tr.vrow>td{background:var(--bg);padding:6px 12px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{font:inherit;font-size:12px;border:0;background:var(--panel);color:var(--ink);padding:3px 10px;cursor:pointer}.seg button.on{background:var(--ink);color:var(--bg)}
.checkline{margin:3px 0}.checkline a{font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Long-session trace viewer</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <input type="text" id="addroot" placeholder="add a folder of runs (path)" size="30">
  <button class="btn" id="addbtn">Add</button>
  <button class="btn" id="reload">Reload</button>
</header>
<main id="main"></main>

<script>/*SNAPSHOT*/</script>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTok=n=>n==null?"":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"k":String(Math.round(n));
const usd=n=>n==null?"":"$"+(n<1?n.toFixed(3):n.toFixed(2));
const pct=n=>n==null?"":(n*100).toFixed(0)+"%";
const sec=n=>n==null?"":n>=60?(n/60).toFixed(1)+" min":n.toFixed(1)+" s";
const COND_COLOR={pi_compact:"var(--c0)",pi_per_client:"var(--c1)",ag_default:"var(--c2)",ag_tight:"var(--c3)",ag_half:"var(--c2)",ag_quarter:"var(--c3)",pi_full:"var(--c4)"};
const colorOf=c=>COND_COLOR[c]||"var(--c5)";
const VERDICT_COLOR={ok:"var(--pass)",lucky:"var(--lucky)",retrieval_miss:"var(--fail)",usage_miss:"#d98a2b",made_up:"var(--fail)"};
const state={onlyFail:false,onlyEv:false,openVisit:null,visitMode:"convo",tab:"guide",runs:[],roots:[],sel:new Set(),data:{},sessions:{},cur:null,turn:null,avgReps:true,xcost:"total",checkFilter:{tag:"",outcome:"",verdict:"",placement:"",age:""},checkSel:null};

async function api(p,opt){if(window.SNAPSHOT)return snapApi(p);const r=await fetch(p,opt);if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.error||r.status)}
  const t=r.headers.get("content-type")||"";return t.includes("json")?r.json():r.text()}
function snapApi(p){const S=window.SNAPSHOT;if(p==="/api/runs")return {roots:["snapshot"],runs:S.runs};
  const m=p.match(/^\/api\/run\/([^/]+)\/(.+)$/);if(!m)throw new Error("not found");const id=decodeURIComponent(m[1]),w=m[2];
  if(w==="all")return S.data[id];if(w==="session")return S.session;
  if(w.startsWith("deliverable/")){const x=S.deliv[id]?.[w.slice(12)];if(x==null)throw new Error("deliverable never written");return x}
  throw new Error("Not in this snapshot: exact requests and responses live in raw/ on the machine that ran it. Run the viewer locally to see them.")}
async function loadRuns(){const j=await api("/api/runs");state.runs=j.runs;state.roots=j.roots}
async function getRun(id){if(!state.data[id])state.data[id]=await api("/api/run/"+encodeURIComponent(id)+"/all");return state.data[id]}
async function getSession(id){if(!(id in state.sessions)){try{state.sessions[id]=await api("/api/run/"+encodeURIComponent(id)+"/session")}catch{state.sessions[id]=null}}return state.sessions[id]}

function nav(){const t=[["guide","Guide"],["runs","Runs"],["run","Run"],["checks","Checks"],["compare","Compare"],["side","Side by side"]];
  $("#nav").innerHTML=t.map(([k,l])=>`<button data-t="${k}" class="${state.tab===k?"on":""}">${l}</button>`).join("");
  $("#nav").onclick=e=>{const b=e.target.closest("button");if(b){state.tab=b.dataset.t;render()}}}
$("#reload").onclick=async()=>{state.data={};state.sessions={};await loadRuns();render()};
$("#addbtn").onclick=async()=>{const p=$("#addroot").value.trim();if(!p)return;
  try{await api("/api/add_root",{method:"POST",body:JSON.stringify({path:p})});$("#addroot").value="";await loadRuns();render()}catch(e){alert(e.message)}};

/* ---------- svg helpers ---------- */
function scale(d0,d1,r0,r1){const f=v=>r0+(v-d0)/((d1-d0)||1)*(r1-r0);f.inv=p=>d0+(p-r0)/((r1-r0)||1)*(d1-d0);return f}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function axisY(y,max,w,fmt,l){let s="";for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+=`<line x1="${l}" x2="${w}" y1="${yy}" y2="${yy}"/><text x="${l-4}" y="${yy+3}" text-anchor="end">${fmt(v)}</text>`}return `<g class="grid">${s}</g>`}
function axisX(x,n,h,step=20){let s="";for(let t=0;t<=n;t+=step)s+=`<text x="${x(t)}" y="${h+12}" text-anchor="middle">${t}</text>`;return s}

/* a chart whose x is the turn number; pick a turn by clicking */
function turnChart({id,h=150,series,n,fmtY,ymax,bands,markers,extra,showSel=true}){
  const w=900,l=44,r=8,t=8,b=18,x=scale(1,n,l,w-r);
  const max=ymax||niceMax(Math.max(1,...series.flatMap(s=>s.vals.filter(v=>v!=null))));
  const y=scale(0,max,h-b,t);
  let g=axisY(y,max,w-r,fmtY,l)+axisX(x,n,h-b);
  (bands||[]).forEach((bd,i)=>{g+=`<rect x="${x(bd.a)-.5*((w-l-r)/n)}" y="${t}" width="${(bd.b-bd.a+1)*((w-l-r)/n)}" height="${h-b-t}" fill="${bd.color}" opacity="${i%2?.05:.10}"/>`});
  series.forEach(s=>{
    if(s.type==="bars"){const bw=Math.max(1,(w-l-r)/n-1);s.vals.forEach((v,i)=>{if(v==null)return;g+=`<rect x="${x(i+1)-bw/2}" y="${y(v+(s.base?s.base[i]||0:0))}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" fill="${s.color}" opacity=".85"/>`})}
    else{let d="";s.vals.forEach((v,i)=>{if(v==null)return;d+=(d?"L":"M")+x(i+1).toFixed(1)+" "+y(v).toFixed(1)});g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.6}" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/>`}});
  (markers||[]).forEach(m=>{g+=m.ceil?`<line x1="${l}" x2="${w-r}" y1="${y(m.ceil)}" y2="${y(m.ceil)}" stroke="var(--fail)" stroke-dasharray="4 3" opacity=".6"/><text x="${w-r}" y="${y(m.ceil)-3}" text-anchor="end">${m.label}</text>`:
    `<line x1="${x(m.turn)}" x2="${x(m.turn)}" y1="${t}" y2="${h-b}" stroke="${m.color}" stroke-width="${m.w||1}" opacity="${m.op||.7}"><title>${esc(m.title||"")}</title></line>`});
  if(extra)g+=extra(x,y,h-b);
  if(showSel&&state.turn!=null&&n>=state.turn)g+=`<line x1="${x(state.turn)}" x2="${x(state.turn)}" y1="${t}" y2="${h-b}" stroke="var(--ink)" stroke-width="1.5"/>`;
  return `<svg id="${id}" viewBox="0 0 ${w} ${h}" width="100%" style="display:block;cursor:crosshair" data-l="${l}" data-r="${r}" data-n="${n}" data-w="${w}">${g}</svg>`}
function wirePick(root,fn){root.querySelectorAll("svg[data-n]").forEach(sv=>sv.addEventListener("click",e=>{
  const rc=sv.getBoundingClientRect(),w=+sv.dataset.w,l=+sv.dataset.l,r=+sv.dataset.r,n=+sv.dataset.n;
  const px=(e.clientX-rc.left)/rc.width*w;const t=Math.round(1+(px-l)/(w-l-r)*(n-1));if(t>=1&&t<=n)fn(t)}))}

/* ---------- derived series ---------- */
function derive(d){const turns=d.turns||[];const n=Math.max(turns.length,d.run?.turns_completed||0,1);
  const tb={};turns.forEach(t=>tb[t.turn]=t);
  const arr=f=>Array.from({length:n},(_,i)=>tb[i+1]?f(tb[i+1]):null);
  let ca=0,cg=0;const cumA=[],cumG=[];for(let i=1;i<=n;i++){const t=tb[i];ca+=t?.actor_usd||0;cg+=t?.gatherer_usd||0;cumA.push(ca);cumG.push(cg)}
  const gr=(d.grades||[]).filter(g=>g.kind!=="unknown").sort((a,b)=>a.turn-b.turn);
  const roll=Array(n).fill(null);const W=12;
  gr.forEach((g,i)=>{const w=gr.slice(Math.max(0,i+1-W),i+1);roll[g.turn-1]=w.filter(x=>x.outcome==="pass").length/w.length});
  let last=null;for(let i=0;i<n;i++){if(roll[i]==null)roll[i]=last;else last=roll[i]}
  return {n,tb,ctx:arr(t=>t.context_tokens),secA:arr(t=>Math.max(0,(t.seconds||0)-(t.gatherer_seconds||0))),secG:arr(t=>t.gatherer_seconds||0),
    cumA,cumG,cumT:cumA.map((v,i)=>v+cumG[i]),roll,gr}}
/* ---------- fact-age bins (one place for the edges) ---------- */
const AGE_EDGES={fresh:[2,10],medium:[15,45],old:[60,1e9]};  /* inclusive turn ranges; anything else is "other" */
const AGE_NAMES=["fresh","medium","old"];
const AGE_COLOR={fresh:"var(--c1)",medium:"var(--c2)",old:"var(--c3)",other:"var(--c4)"};
const AGE_TEXT={fresh:"fact was said 2 to 10 turns before the check",medium:"15 to 45 turns before",old:"60 or more turns before",other:"some other age (not in the fixed mix)"};
const SESSION_WINDOW=30;   /* turns per session window */
const MIN_N=3;             /* points with fewer checks than this are drawn hollow */
function ageBinOf(g){
  if(g.age_bin!==undefined&&g.age_bin!==null)return g.age_bin;
  if(g.kind==="unknown"||g.age_turns==null)return null;
  for(const k of AGE_NAMES){const [a,b]=AGE_EDGES[k];if(g.age_turns>=a&&g.age_turns<=b)return k}
  return "other"}
const sessionBinOf=g=>g.session_bin!=null?g.session_bin:Math.floor((g.turn-1)/SESSION_WINDOW);
const winLabel=i=>(i*SESSION_WINDOW+1)+"-"+((i+1)*SESSION_WINDOW);
/* rows: grade rows (stated facts only). returns {n,pass} per [ageBin][window] */
function ageGrid(rows){const m={};rows.forEach(g=>{const a=ageBinOf(g);if(!a)return;const w=sessionBinOf(g);((m[a]??={})[w]??={n:0,pass:0}).n++;if(g.outcome==="pass")m[a][w].pass++});return m}
/* small line chart: x = session window, y = pass rate. lines: [{label,color,dash,pts:{window:{n,v}}}] */
function windowChart(lines,nw,{w=300,h=170,title=""}={}){
  const l=34,r=8,t=8,b=30,x=scale(0,Math.max(nw-1,1),l+8,w-r-8),y=scale(0,1,h-b,t);
  let g=axisY(y,1,w-r,pct,l);
  for(let i=0;i<nw;i++)g+=`<text x="${x(i)}" y="${h-b+12}" text-anchor="middle" style="font-size:9px">${winLabel(i)}</text>`;
  g+=`<text x="${(l+w-r)/2}" y="${h-3}" text-anchor="middle" style="font-size:9px">session window (turns)</text>`;
  lines.forEach(L=>{let d="",prev=false;
    for(let i=0;i<nw;i++){const p=L.pts[i];if(!p||p.v==null||p.n<MIN_N){prev=false;continue}d+=(prev?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1);prev=true}
    g+=`<path d="${d}" fill="none" stroke="${L.color}" stroke-width="1.8" ${L.dash?`stroke-dasharray="${L.dash}"`:""}/>`;
    for(let i=0;i<nw;i++){const p=L.pts[i];if(!p||p.v==null)continue;const ok=p.n>=MIN_N;
      g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.6" fill="${ok?L.color:"var(--panel)"}" stroke="${L.color}" stroke-width="1.5"><title>${esc(L.label)} | turns ${winLabel(i)} | ${pct(p.v)} correct | n=${p.n}${ok?"":" (too few, not joined)"}</title></circle>`}});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block" role="img" aria-label="${esc(title)}">${g}</svg>`}
const attrBy=d=>{const m={};(d.attribution||[]).forEach(a=>m[a.check_id]=a);return m};

/* ---------- RUNS tab ---------- */
function viewRuns(){
  const R=state.runs;
  let h=`<div class="panel"><h2>Runs <span class="muted" style="text-transform:none;letter-spacing:0">(${R.length} found under ${state.roots.map(esc).join(", ")})</span></h2>`;
  if(!R.length)h+=`<p class="muted">No runs yet. A run is a folder containing run.json in the layout described in TRACE.md. Generate fake ones with <code>python viewer/make_synthetic.py</code>.</p>`;
  else{h+=`<table><tr><th></th><th>run</th><th>status</th><th class="n">turns</th><th class="n">pass</th><th class="n">A</th><th class="n">C</th><th class="n">D</th><th class="n">CTRL</th><th class="n">made up</th>
  <th class="n">actor $</th><th class="n">gatherer $</th><th class="n">total $</th><th class="n">latency</th><th class="n">retrieval / usage misses</th></tr>`;
  R.forEach(r=>{const bt=r.by_tag||{};h+=`<tr class="click" data-id="${esc(r.id)}"><td><input type="checkbox" data-sel="${esc(r.id)}" ${state.sel.has(r.id)?"checked":""}></td>
   <td><span class="dot" style="background:${colorOf(r.condition)}"></span><b>${esc(r.id)}</b>${r.synthetic?' <span class="chip">synthetic</span>':""}</td>
   <td>${esc(r.status||"")}</td><td class="n">${r.turns??""}</td><td class="n"><b>${pct(r.overall)}</b></td>
   <td class="n">${pct(bt.A)}</td><td class="n">${pct(bt.C)}</td><td class="n">${pct(bt.D)}</td><td class="n">${pct(bt.CTRL)}</td><td class="n">${pct(r.made_up_rate)}</td>
   <td class="n">${usd(r.cost?.actor_usd)}</td><td class="n">${usd(r.cost?.gatherer_usd)}</td><td class="n">${usd(r.cost?.total_usd)}</td><td class="n">${sec(r.seconds)}</td>
   <td class="n">${r.has_attribution?r.misses.retrieval_miss+" / "+r.misses.usage_miss:'<span class="muted">run attribute.py</span>'}</td></tr>`});
  h+=`</table><p class="muted">Click a row to open it. Tick runs and open Compare. Pass rates count checks on facts that were stated; "made up" is the share of never-stated fields where the agent gave a value anyway.</p>`}
  h+=`</div>`;$("#main").innerHTML=h;
  $("#main").onclick=e=>{const c=e.target.closest("[data-sel]");if(c){c.checked?state.sel.add(c.dataset.sel):state.sel.delete(c.dataset.sel);return}
    const tr=e.target.closest("tr[data-id]");if(tr){state.cur=tr.dataset.id;state.turn=null;state.tab="run";render()}}}

/* ---------- shared: conversation, stories ---------- */
const TAG_TEXT={A:"old fact (said 40+ turns earlier)",C:"returning to this client after 2+ other visits",D:"the fact was changed later; only the newest value counts",CTRL:"control: the value is restated in the request",NEAR:"fact said a few turns earlier",UNK:"never told; the right answer is null"};
const VERDICT_TEXT={ok:"Correct, and the fact was in what the model saw.",lucky:"Correct, but the fact was not in what the model saw (a guess, or picked up some other way).",
  retrieval_miss:"Wrong, and the fact was not in what the model saw: compaction or AG lost it. A memory failure.",
  usage_miss:"Wrong even though the fact was in what the model saw: the model had it and did not use it.",made_up:"The agent invented a value for something it was never told."};
const OUTCOME_TEXT={pass:"correct",stale:"used an old value that had been changed",wrong:"wrong value",missing_key:"left the field out",no_header:"file had no readable header",missing_file:"never wrote the file",made_up:"made up a value"};
const clip=(s,n)=>s&&s.length>n?s.slice(0,n)+" [...]":s||"";
function hl(text,needle){const t=esc(text);if(!needle)return t;const n=esc(needle);const i=t.toLowerCase().indexOf(n.toLowerCase());
  return i<0?t:t.slice(0,i)+`<mark>${t.slice(i,i+n.length)}</mark>`+t.slice(i+n.length)}
function msgsBy(d){const m={};(d.messages||[]).forEach(r=>m[r.turn]=r);return m}
function decisionLine(x){
  if(x.kind==="boundary")return `<div class="ev ${x.detail.new_task?"evnew":""}">AG boundary check: <b>${x.detail.new_task?"new task":"same task"}</b> <span class="muted">${esc(x.detail.why||"")}</span></div>`;
  if(x.kind==="compaction")return `<div class="ev evc">Compaction: history summarized, ${fmtTok(x.detail.tokens_before)} to ${fmtTok(x.detail.tokens_after)} tokens. Anything not in the summary is gone from the model's view.</div>`;
  if(x.kind==="build")return `<div class="ev">AG build ${x.detail.build_id??""} started <span class="muted">(rebuilds the context from stored tasks${x.detail.forced?", forced by size":""})</span></div>`;
  return `<div class="ev">${esc(x.kind)}</div>`}
function stepsHtml(steps,needle){
  if(!steps||!steps.length)return '<div class="muted small">No agent reply recorded for this turn.</div>';
  return steps.map(s=>{
    if(s.kind==="text")return `<div class="bub agent">${hl(clip(s.text,1500),needle)}</div>`;
    if(s.kind==="thinking")return `<details class="tool"><summary>model thinking</summary><pre>${esc(clip(s.text,3000))}</pre></details>`;
    if(s.kind==="tool_call"){let a=s.text;let p=null;try{p=JSON.parse(a)}catch{}
      const label=p&&p.path?`${esc(s.name)} ${esc(p.path)}`:esc(s.name);
      const body=p&&p.content!=null?p.content:(p?JSON.stringify(p,null,1):a);
      return `<details class="tool" ${needle&&body&&body.toLowerCase().includes(String(needle).toLowerCase())?"open":""}><summary>tool call: ${label}</summary><pre>${hl(clip(body,4000),needle)}</pre></details>`}
    if(s.kind==="tool_result")return `<div class="muted small">tool result (${esc(s.name||"")}): ${esc(clip(s.text,200))}</div>`;
    return ""}).join("")}
function turnConvo(d,sess,t,opts={}){
  const M=msgsBy(d);const m=M[t];const user=m?.user??sess?.session?.[t-1]?.text??"";
  const long=user.length>(opts.full?99999:600);
  let h=`<div class="turnhead">turn ${t}${opts.label?" · "+opts.label:""}</div>`;
  h+=`<div class="bub user">${long?`<span>${hl(user.slice(0,600),opts.needle)}</span><details><summary>show all ${user.length} characters</summary>${hl(user,opts.needle)}</details>`:hl(user,opts.needle)}</div>`;
  h+=stepsHtml(m?.steps,opts.needleAgent);
  return h}
function turnModelView(d,t){
  const c=ctxHtml(d,t);
  return `<div class="turnhead">turn ${t} · what the model saw (${fmtTok(c.total)} tokens)</div>${c.html}
   ${c.last?`<div class="row" style="margin:4px 0"><button class="btn sm" data-req="${c.last.call_id}">full request</button><button class="btn sm" data-resp="${c.last.call_id}">raw response</button></div><div data-box="${c.last.call_id}"></div>`:""}`}
function wireReqButtons(root){
  root.querySelectorAll("[data-req]").forEach(b=>b.onclick=()=>showRequest(b.dataset.req,null,root.querySelector(`[data-box="${b.dataset.req}"]`)));
  root.querySelectorAll("[data-resp]").forEach(b=>b.onclick=()=>showResponse(b.dataset.resp,root.querySelector(`[data-box="${b.dataset.resp}"]`)))}
function factFor(sess,chk){if(!chk||chk.stated_turn==null)return null;return sess?.facts?.[chk.client]?.[chk.field]?.find(f=>f.turn===chk.stated_turn)||null}
function visitOf(sess,t){return sess?.visits?.find(v=>v.first_turn<=t&&t<=v.last_turn)}
function storyHtml(d,sess,g){
  const chk=sess?.checks?.find(c=>c.check_id===g.check_id);const f=factFor(sess,chk);const a=attrBy(d)[g.check_id];
  const lines=[];
  const fieldName=g.field==="style_rule"?"wording rule":g.field.replace(/_/g," ");
  if(g.kind==="unknown"){
    lines.push(`The user never told the agent ${esc(g.client)}'s <b>${esc(fieldName)}</b> before turn ${g.turn}.`);
  }else if(f){const sv=visitOf(sess,f.turn);
    lines.push(`<b>Turn ${f.turn}</b>: the user said ${esc(g.client)}'s ${esc(fieldName)}${f.placement==="embedded"&&sv?`, in passing, while working on <b>${esc(sv.client)}</b>`:` during a ${esc(g.client)} visit`}: <i>"${esc(f.sentence)}"</i>`);
    const all=sess.facts[chk.client][chk.field];const later=all.filter(x=>x.turn<g.turn&&x.turn!==f.turn);
    if(chk.superseded_values?.length){const old=all.filter(x=>x.turn<f.turn);
      if(old.length)lines.push(`Earlier, on turn ${old.map(x=>x.turn).join(", ")}, the value had been <b>${esc(JSON.stringify(old[0].value))}</b>. This check wants the newer one.`)}
    const between=(d.decisions||[]).filter(x=>x.turn>f.turn&&x.turn<=g.turn);
    const comp=between.filter(x=>x.kind==="compaction").map(x=>x.turn);
    const nt=between.filter(x=>x.kind==="boundary"&&x.detail.new_task).map(x=>x.turn);
    const away=chk.visits_since_client_last_seen;
    let mid=`Then ${g.turn-f.turn} turns passed`;const bits=[];
    if(away!=null)bits.push(`${away} visit${away===1?"":"s"} to other clients before returning`);
    if(comp.length)bits.push(`<b>${comp.length} compaction${comp.length>1?"s":""}</b> (turn ${comp.join(", ")})`);
    if(nt.length)bits.push(`AG started ${nt.length} new task${nt.length>1?"s":""}`);
    lines.push(mid+(bits.length?": "+bits.join(", "):"")+".");
  }
  lines.push(`<b>Turn ${g.turn}</b>: the user asked for ${esc(g.deliverable_id)}. The agent wrote <b>${esc(JSON.stringify(g.got))}</b>; the right answer is <b>${esc(JSON.stringify(g.expected))}</b>. Result: <span class="${g.outcome==="pass"?"okc":"failc"}">${esc(OUTCOME_TEXT[g.outcome]||g.outcome)}</span>.`);
  if(a&&a.presence&&a.presence!=="n/a")lines.push(`When it wrote the file, the fact was <b>${a.presence==="absent"?"not in":a.presence==="verbatim"?"in (word for word)":"in (reworded, e.g. inside a summary)"}</b> what the model saw. ${esc(VERDICT_TEXT[a.verdict]||"")}`);
  else if(a&&a.verdict==="made_up")lines.push(esc(VERDICT_TEXT.made_up));
  else if(!a&&g.kind!=="unknown")lines.push(`<span class="muted">Whether the fact was in view is unknown until analysis/attribute.py runs (needs the local raw/ folder).</span>`);
  return `<div class="story"><div class="row" style="margin-bottom:4px">${g.tags.map(t=>`<span class="chip" title="${esc(TAG_TEXT[t]||"")}">${t}</span>`).join("")}<span class="muted small">${g.tags.map(t=>TAG_TEXT[t]).filter(Boolean).join("; ")}</span></div><ol>${lines.map(l=>`<li>${l}</li>`).join("")}</ol></div>`}

   ${turnChart({id:"c3",h:110,n:D.n,series:[{type:"bars",vals:D.secA,color:"var(--c0)"},...(isAG?[{type:"bars",vals:D.secG,base:D.secA,color:"var(--c2)"}]:[])],fmtY:v=>v.toFixed(0)+"s",ymax:niceMax(Math.max(1,...D.secA.map((v,i)=>(v||0)+(D.secG[i]||0)))),showSel:false})}
   <div class="muted small">seconds per turn: actor (blue) plus gatherer (orange)</div>
   ${turnChart({id:"c4",h:110,n:D.n,series:[{vals:D.cumA,color:"var(--c0)"},...(isAG?[{vals:D.cumG,color:"var(--c2)"},{vals:D.cumT,color:"var(--ink)",w:1.2}]:[])],fmtY:usd,showSel:false})}

  {const rows=(d.grades||[]).filter(g=>g.kind!=="unknown"&&g.turn<=done);const grid=ageGrid(rows);const nw=Math.max(1,Math.ceil(D.n/SESSION_WINDOW));

   h+=`<div class="panel"><h2>Accuracy by fact age over the session</h2><div class="row" style="align-items:flex-start;gap:20px"><div style="width:380px;max-width:100%">${windowChart(lines,nw,{w:380,h:190,title:"pass rate by fact age and session window"})}</div>

function renderVisit(d,sess,v,decBy,grByTurn){
  const el=$("#vdetail");const mode=state.visitMode||"convo";const last=Math.min(v.last_turn,derive(d).n);
  let h=`<div class="row" style="margin:6px 0 10px"><b>Visit ${v.visit}: ${esc(v.client)}, ${esc(v.kind)}</b>
   <span class="seg"><button class="${mode==="convo"?"on":""}" data-mode="convo">Conversation</button><button class="${mode==="model"?"on":""}" data-mode="model">What the model saw</button></span>
   <span class="muted small">${mode==="convo"?"User messages and the agent's replies and tool calls, as they happened.":"Per turn: what was in the model's input. Blue = original messages kept word for word, purple = summaries (AG items or the compaction summary)."}</span></div>`;
  if((v.planted||[]).length)h+=`<div class="muted small" style="margin-bottom:6px">Facts introduced in this visit: ${v.planted.map(p=>`${esc(p[0])} ${esc(p[1].replace(/_/g," "))}${p[2]==="embedded"?" (in passing)":""}`).join("; ")}</div>`;
  const prevV=sess.visits.find(x=>x.visit===v.visit-1);
  for(let t=v.first_turn;t<=last;t++){
    (decBy[t]||[]).forEach(x=>h+=decisionLine(x));
    const bl=(d.builds||[]).find(b=>b.turn===t);
    if(bl)h+=`<details class="ev"><summary>AG build ${bl.build_id}: ${esc(bl.status)}${bl.seconds?", took "+sec(bl.seconds):""}${bl.adopted_by_read?", used from turn "+bl.adopted_by_read:""}. What AG stored and inserted</summary>
      <div class="small">Sections it puts in front of the model: ${(bl.sections||[]).map(s=>`${esc(s.name)} (${fmtTok(s.tokens)})`).join(", ")||"none recorded"}</div>
      ${bl.tasks?`<table class="small">${bl.tasks.map(k=>`<tr><td>task ${k.index}</td><td><b>${esc(k.name)}</b><div class="muted">${esc(k.description||"")}</div></td><td class="n">turns ${k.first_turn}-${k.last_turn}</td><td class="n">${fmtTok(k.tokens)}</td></tr>`).join("")}</table>`:'<div class="muted small">Task list not recorded for this build (AG keeps only its latest split).</div>'}</details>`;
    h+=`<div class="turnblock">${mode==="convo"?turnConvo(d,sess,t):turnModelView(d,t)}</div>`;
    const gs=grByTurn[t]||[];
    if(gs.length)h+=`<div class="sec">Checks on ${esc(gs[0].deliverable_id)}</div>`+gs.map(g=>`<div class="checkline"><span class="chip ${g.outcome==="pass"?"pass":"fail"}">${g.outcome==="pass"?"✓":"✗"} ${esc(g.field)}</span> <a href="#" data-story="${esc(g.check_id)}">${g.outcome==="pass"?"how it got this right":"why it went wrong"}</a><div class="storybox" data-sb="${esc(g.check_id)}"></div></div>`).join("");
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=e=>{e.stopPropagation();state.visitMode=b.dataset.mode;renderVisit(d,sess,v,decBy,grByTurn)});
  el.querySelectorAll("[data-story]").forEach(a=>a.onclick=e=>{e.preventDefault();const box=el.querySelector(`[data-sb="${a.dataset.story}"]`);
    if(box.innerHTML){box.innerHTML="";return}const g=d.grades.find(x=>x.check_id===a.dataset.story);
    box.innerHTML=storyHtml(d,sess,g)+`<a href="#" data-full="${esc(g.check_id)}">open the full story with both conversation excerpts</a>`;
    box.querySelector("[data-full]").onclick=ev=>{ev.preventDefault();state.checkSel=g.check_id;state.tab="checks";render()}});
  wireReqButtons(el)}

function reqMessages(req){const out=[];if(req&&req.body&&typeof req.body==="object")req=req.body;
  if(Array.isArray(req.contents)){const pt=p=>p.text!=null?p.text:p.functionCall?JSON.stringify(p.functionCall):p.functionResponse?JSON.stringify(p.functionResponse):"";
    const si=req.systemInstruction||req.system_instruction;if(si)out.push({role:"system",text:(si.parts||[]).map(pt).join("\n")});
    req.contents.forEach(c=>out.push({role:c.role,text:(c.parts||[]).map(pt).join("\n")}));return out}
  if(typeof req.system==="string")out.push({role:"system",text:req.system});
  (req.messages||[]).forEach(m=>{let c=m.content;if(Array.isArray(c))c=c.map(p=>typeof p==="string"?p:(p.text||p.content||p.input&&JSON.stringify(p.input)||"")).join("\n");else if(c&&typeof c!=="string")c=JSON.stringify(c);out.push({role:m.role,text:c||""})});return out}
async function showRequest(callId,needles,box){

function parseResponse(txt){
  // Gemini stream (SSE "data: {...}" lines) or a single JSON body; pull out text, thoughts, tool calls
  const out={text:"",thought:"",calls:[]};const chunks=[];
  txt.split("\n").forEach(l=>{l=l.trim();if(l.startsWith("data:"))l=l.slice(5).trim();if(!l||l==="[DONE]")return;try{chunks.push(JSON.parse(l))}catch{}});
  if(!chunks.length)try{const j=JSON.parse(txt);Array.isArray(j)?chunks.push(...j):chunks.push(j)}catch{return {raw:txt}}
  chunks.forEach(c=>(c.candidates||[]).forEach(cd=>(cd.content?.parts||[]).forEach(p=>{
    if(p.functionCall)out.calls.push(p.functionCall);else if(p.thought&&p.text)out.thought+=p.text;else if(p.text)out.text+=p.text})));
  return out}

const KIND_COLOR={system:"var(--c4)",summary:"var(--c3)",message:"var(--c0)"};
function ctxHtml(d,t){
  const calls=(d.calls||[]).filter(c=>c.turn===t&&(c.purpose||"agent")==="agent");const last=calls[calls.length-1];
  const cx=last&&(d.contexts||[]).find(c=>c.call_id===last.call_id);if(!cx)return {html:'<div class="muted">no context recorded</div>',last};
  const groups=[];cx.items.forEach(it=>{const g=groups[groups.length-1];
    if(g&&it.kind==="message"&&g.kind==="message"){g.tokens+=it.tokens;g.hi=Math.max(g.hi,it.origin_turn??0);g.lo=Math.min(g.lo,it.origin_turn??1e9);g.n++}
    else groups.push({kind:it.kind,label:it.label,tokens:it.tokens,lo:it.origin_turn??1e9,hi:it.origin_turn??0,n:1})});
  const tot=groups.reduce((a,g)=>a+g.tokens,0)||1;
  let s=`<div class="bar">${groups.map(g=>`<span style="width:${g.tokens/tot*100}%;background:${KIND_COLOR[g.kind]}" title="${esc(g.label||g.kind)} ${g.tokens}"></span>`).join("")}</div><table>`+
    groups.map(g=>`<tr><td><span class="dot" style="background:${KIND_COLOR[g.kind]}"></span>${g.kind==="message"?"verbatim":g.kind==="summary"?"AG / summary":"system"}</td><td>${g.kind==="message"?"turns "+(g.lo===g.hi?g.lo:g.lo+" to "+g.hi):esc(g.label||"")}</td><td class="n">${fmtTok(g.tokens)}</td></tr>`).join("")+`</table>`;
  return {html:s,last,total:cx.total_tokens}}

function viewGuide(){$("#main").innerHTML=`<div class="panel" style="max-width:900px;line-height:1.6">
<h2>What this experiment asks</h2>
<p>One long scripted session (145 user messages) where an account manager works across four B2B clients, switching between them. Facts about each client (contact, discount, currency, seats, wording preferences) are said once in conversation, some get changed later, and 32 times the user asks for a deliverable that needs those facts. The question: does Actor-Gatherer keep the right facts in front of the model better than plain Pi with compaction, and at what cost?</p>
<h2>Conditions</h2>
<table><tr><td><span class="dot" style="background:var(--c0)"></span>pi_compact</td><td>Pi alone, one thread, compacts (summarizes history) when context passes 100k.</td></tr>
<tr><td><span class="dot" style="background:var(--c1)"></span>pi_per_client</td><td>One Pi thread per client: the "open a new chat per topic" workaround.</td></tr>
<tr><td><span class="dot" style="background:var(--c2)"></span>ag_half (was ag_default)</td><td>Pi with Actor-Gatherer; AG's budgets halved so they fit under 100k.</td></tr>
<tr><td><span class="dot" style="background:var(--c3)"></span>ag_quarter (was ag_tight)</td><td>Same with smaller keep-budgets: cheaper, possibly less accurate. A point on the spend curve.</td></tr></table>
<h2>What is measured</h2>
<table>
<tr><td><b>Pass rate</b></td><td>Each deliverable starts with a JSON header; code compares each field to the true current fact. No model judges.</td></tr>
<tr><td><b>Tags</b></td><td><b>A</b> fact is 40+ turns old. <b>C</b> returning to a client after 2+ other visits. <b>D</b> the fact was changed later (stale value = fail). <b>CTRL</b> the user restates the value in the request, so failures here are not memory failures. <b>NEAR</b> fact said a few turns earlier.</td></tr>
<tr><td><b>Placement</b></td><td>home: said during that client's visit. embedded: mentioned in passing during another client's visit (harder for anything that files history by topic).</td></tr>
<tr><td><b>Made up</b></td><td>Fields asked before the fact was ever said; the right answer is null. Share of those where the agent invented a value.</td></tr>
<tr><td><b>Retrieval vs usage miss</b></td><td>For each failed check, was the fact in the exact request the model got? Not there = retrieval miss (compaction lost it, AG didn't bring it back). There = usage miss (model saw it and still got it wrong). Needs raw/ requests, so run analysis/attribute.py locally.</td></tr>
<tr><td><b>Cost</b></td><td>Three numbers: Pi/actor, Gatherer (AG's own model calls: boundary checks, segmenting, ranking, summarizing), combined.</td></tr>
<tr><td><b>Latency</b></td><td>Wall time per user turn, actor plus gatherer time on top.</td></tr>
<tr><td><b>Facts still in view</b></td><td>On each turn, of everything said so far about the clients (latest value of each fact), the share present in the model's input. Drops show exactly where compaction or AG lost facts, before looking at any grade. This is the direct test of whether degradation is even possible.</td></tr>
<tr><td><b>Context per turn</b></td><td>Tokens in the largest actor call. Shows compaction drops and whether AG keeps context small.</td></tr></table>
<h2>Fixed fact ages: two separate questions</h2>
<p>Each deliverable now asks about a fixed mix of fact ages: <b>fresh</b> (said 2 to 10 turns earlier), <b>medium</b> (15 to 45 turns earlier) and <b>old</b> (60 or more turns earlier). That lets us pull apart two things that used to be tangled. <b>Curve 1, over the session:</b> look only at fresh facts and follow their pass rate from the start of the session to the end. Fresh facts are equally easy everywhere, so a falling line means the agent itself gets worse as the session gets long. <b>Curve 2, by age:</b> pick one stretch of the session and compare fresh, medium and old facts there. A gap means facts get lost as they get older, even when the agent is otherwise working fine. A fact marked "buried" was inside pasted notes or a thread instead of a standalone sentence.</p>
<h2>How to read each tab</h2>
<p><b>Runs</b>: one row per run, tick to compare. <b>Run</b>: the session at a glance (context size with compactions and AG decisions, every check as a dot, and the share of facts still in the model's view), then a list of the 48 client visits. Open a visit to read it as a conversation, or flip to what the model saw on each turn; context-manager decisions appear inline where they happened, and each check has a short story. <b>Checks</b>: every graded field in plain words, filterable; the story card says where the fact was said, what happened in between, and what the agent wrote, with both bits of conversation. <b>Compare</b>: pass rate by tag, placement and fact age, accuracy vs spend, overlays. <b>Side by side</b>: one turn across runs, what each manager decided and what each model saw.</p>
<h2>What would count as AG helping</h2>
<p>Proposed: at least 10 points better than pi_compact on A or C checks, no worse on CTRL, clearly fewer retrieval misses, with the cost difference stated next to it.</p>
<h2>Where the AG items come from</h2>
<p>In "what the model saw", purple rows are AG-made items: <i>gatherer_guide</i> (how to use AG), <i>requests</i> (the user's asks so far), <i>earlier</i> (summaries of earlier tasks it ranked relevant), <i>previous</i> (the task just before). Blue rows are original messages kept verbatim. The exact text is in the request view.</p>
${window.SNAPSHOT?`<p class="muted">This is a snapshot of ${window.SNAPSHOT.runs.length} smoke runs (turns 1 to 30 or 60), built ${esc(window.SNAPSHOT.built)}. Exact requests and responses are not included; run <code>python tim/viewer/serve.py</code> on the laptop that ran them to see those.</p>`:""}
</div>`}

       if(cs.length)pts[i]={n:cs.reduce((a,c)=>a+c.n,0),v:mean(cs.map(c=>c.pass/c.n))}}
     return {label:label(g),color:gcol(g),dash:state.avgReps?null:(gi%3)==1?"5 3":(gi%3)==2?"2 2":null,pts}});
   h+=`<div class="panel"><h2>Accuracy over the session at fixed fact age</h2><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">${AGE_NAMES.map(k=>`<div><div class="small"><b>${k}</b> <span class="muted">(${esc(AGE_TEXT[k])})</span></div>${windowChart(mk(k),nw,{title:k+" facts"})}</div>`).join("")}</div>
    <p class="small" style="margin:8px 0 2px"><b>How to read it.</b> If the fresh line falls from left to right, the agent gets worse as the session grows longer. If, in the same window, the old line sits below the fresh line, facts are being lost as they age.</p>
    <p class="muted small" style="margin:2px 0">Each dot is the pass rate on checks of that fact age inside a 30-turn window; hover for n. Hollow dots have fewer than ${MIN_N} checks and are not joined by the line.${state.avgReps?" Replicates of a condition are averaged (n is the total across them).":""} Older runs without stored age bins are binned here from the turn and age of each check.</p></div>`}
  h+=barGroup("Pass rate by check type",[{label:"overall",f:()=>true},{label:"A: old fact",f:r=>r.tags.includes("A")},{label:"C: return to client",f:r=>r.tags.includes("C")},{label:"D: superseded",f:r=>r.tags.includes("D")},{label:"CTRL",f:r=>r.tags.includes("CTRL")},{label:"NEAR",f:r=>r.tags.includes("NEAR")}],(g,c)=>stat(g,c.f));
  h+=barGroup("Pass rate by where the fact was said",[{label:"home (client's own visit)",f:r=>r.placement==="home"},{label:"embedded (in passing)",f:r=>r.placement==="embedded"}],(g,c)=>stat(g,c.f));
  h+=barGroup("Pass rate by fact age (turns between the fact and the check): does accuracy degrade?",AGE_BINS_OLD.map(([l,a,b])=>({label:l+" turns",f:r=>r.age_turns!=null&&r.age_turns>=a&&r.age_turns<=b})),(g,c)=>stat(g,c.f));
  // spend vs accuracy
  const xv=g=>mean(g.map(x=>state.xcost==="total"?x.d.cost?.total_usd:state.xcost==="actor"?x.d.cost?.actor_usd:x.d.cost?.gatherer_usd).filter(v=>v!=null));
  const pts=groups.map(g=>({g,x:xv(g),y:stat(g,()=>true)})).filter(p=>p.x!=null&&p.y!=null);
  {const w=900,H=260,l=54,r=20,t=12,b=34;const xm=niceMax(Math.max(...pts.map(p=>p.x),.01)*1.1);const x=scale(0,xm,l,w-r);const y0=Math.max(0,Math.floor((Math.min(...pts.map(p=>p.y),1)-.08)*10)/10);const y=scale(y0,1,H-b,t);
    let s=axisY(y,1,w-r,pct,l).replace(/./,m=>m);s="";for(let i=0;i<=4;i++){const v=y0+(1-y0)*i/4;s+=`<g class="grid"><line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}"/></g><text x="${l-4}" y="${y(v)+3}" text-anchor="end">${pct(v)}</text>`}
    for(let i=0;i<=4;i++){const v=xm*i/4;s+=`<text x="${x(v)}" y="${H-b+14}" text-anchor="middle">${usd(v)}</text>`}
    pts.forEach((p,pi)=>{const dy=(pi%2?-12:14);s+=`<circle cx="${x(p.x)}" cy="${y(p.y)}" r="7" fill="${gcol(p.g)}" opacity=".9"><title>${esc(label(p.g))}: ${pct(p.y)} for ${usd(p.x)}</title></circle><text x="${x(p.x)+10}" y="${y(p.y)+4+dy}">${esc(label(p.g))}</text>`});
    h+=`<div class="panel"><h2>Accuracy vs spend <label style="text-transform:none;letter-spacing:0;font-weight:400">x axis <select id="xc"><option value="total" ${state.xcost==="total"?"selected":""}>combined cost</option><option value="actor" ${state.xcost==="actor"?"selected":""}>Pi / actor cost</option><option value="gatherer" ${state.xcost==="gatherer"?"selected":""}>Gatherer cost</option></select></label></h2>
     <svg viewBox="0 0 ${w} ${H}" width="100%">${s}</svg><p class="muted">One point per ${state.avgReps?"condition (mean of its replicates)":"run"}. Up and to the left is better. More conditions with different knob settings (say 5k, 15k, 30k keep tokens) turn this into the trade-off curve.</p></div>`}
  // overlays
  const n=Math.max(...info.map(x=>x.D.n));
  const ov=(title,key,fmt,ymax)=>`<div class="panel"><h2>${title}</h2>${turnChart({id:"ov"+key,h:150,n,showSel:false,series:info.map((x,i)=>({vals:x.D[key],color:colorOf(x.card.condition),dash:(i%3)==1?"5 3":(i%3)==2?"2 2":null})),fmtY:fmt,ymax})}
    <div class="legend">${info.map((x,i)=>`<span><span class="dot" style="background:${colorOf(x.card.condition)}"></span>${esc(x.id)}</span>`).join("")}</div></div>`;
  h+=ov("Context size per turn","ctx",fmtTok)+ov("Rolling accuracy (last 12 checks) over the session","roll",pct,1)+ov("Cumulative cost, combined","cumT",usd);
  // misses
  h+=`<div class="panel"><h2>Why checks failed</h2><table><tr><th>run</th><th class="n">failures</th><th class="n">retrieval misses (fact not in view)</th><th class="n">usage misses (fact in view, wrong answer)</th><th class="n">lucky passes</th></tr>
   ${info.map(x=>{const a=(x.d.attribution||[]).filter(r=>r.presence!=="n/a");const rm=a.filter(r=>r.verdict==="retrieval_miss").length,um=a.filter(r=>r.verdict==="usage_miss").length;
   return `<tr><td>${esc(x.id)}</td><td class="n">${a.length?rm+um:""}</td><td class="n">${a.length?rm:'<span class="muted">run attribute.py</span>'}</td><td class="n">${a.length?um:""}</td><td class="n">${a.filter(r=>r.verdict==="lucky").length||""}</td></tr>`}).join("")}</table></div>`;
  $("#main").innerHTML=h;
  $("#avg").onchange=e=>{state.avgReps=e.target.checked;viewCompare()};const xc=$("#xc");if(xc)xc.onchange=e=>{state.xcost=e.target.value;viewCompare()}}

async function render(){nav();try{if(state.tab==="guide")viewGuide();else if(state.tab==="side")await viewSide();else if(state.tab==="runs")viewRuns();else if(state.tab==="run")await viewRun();else if(state.tab==="checks")await viewChecks();else await viewCompare()}catch(e){$("#main").innerHTML=`<div class="panel err">${esc(e.stack||e.message)}</div>`}}
loadRuns().then(render).catch(e=>{$("#main").innerHTML=`<div class="panel err">${esc(e.message)}</div>`});
</script>
</body>
